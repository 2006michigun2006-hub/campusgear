name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusgear
          POSTGRES_PASSWORD: campusgear
          POSTGRES_DB: campusgear_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusgear"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://campusgear:campusgear@localhost:5432/campusgear_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Unit, API, role, overlap and concurrency tests
        run: npm test
      - name: Build client
        run: npm run build
